[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "sqlite",
  "macros",
  "migrate",
  "uuid",
  "chrono",
]}
serde = "1.0.228"
serde_json = "1.0.149"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1.89"
thiserror = "2.0.18"
